<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Studio Kolase Pro - Fitur Sempurna</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2 family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #eef2f9 0%, #dfe6f0 100%);
            font-family: 'Inter', sans-serif;
            padding: 20px 16px 40px;
            min-height: 100vh;
            color: #1a2c3e;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #1f3b4c, #2c5f8a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        /* Camera Toggle Switch */
        .camera-control-box {
            display: flex;
            align-items: center;
            background: white;
            padding: 8px 18px;
            border-radius: 50px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            gap: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid #cbdbe2;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e26a6a;
            transition: .3s;
            border-radius: 34px;
        }
        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider-toggle {
            background-color: #2e7d32;
        }
        input:checked + .slider-toggle:before {
            transform: translateX(24px);
        }

        .btn {
            background: white;
            border: 1px solid #cbdbe2;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            color: #1f2f3e;
        }
        .btn-primary {
            background: #2c5f8a;
            color: white;
            border: none;
            box-shadow: 0 8px 20px -6px rgba(44,95,138,0.4);
        }
        .btn-primary:hover { background: #1e4768; transform: translateY(-1px); }
        .btn:hover:not(.btn-primary) { border-color: #2c5f8a; background: #fafafa; }

        #videoElement {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 1rem;
            background: #000;
            display: none;
            margin: 0 auto 16px;
            transform: scaleX(-1); /* Mirror view */
        }

        /* Layout Grid Editor */
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 768px) { .editor-grid { grid-template-columns: 1fr; } }

        .canvas-card {
            background: white;
            border-radius: 1.5rem;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e6edf2;
        }
        .canvas-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .canvas-wrapper {
            background: #f8fafc;
            border-radius: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            border: 2px dashed #cbdbe2;
            overflow: hidden;
            position: relative;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* Bagian Pengaturan Kolase */
        .collage-section {
            background: white;
            border-radius: 1.5rem;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e6edf2;
        }
        
        /* Pilihan Model Grid 2 Kotak */
        .grid-library {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 16px 0 24px;
        }
        .grid-option {
            background: #f8fafc;
            border: 2px solid #e2ecf5;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .grid-option:hover, .grid-option.active {
            border-color: #2c5f8a;
            background: #f0f6fc;
        }
        .grid-icon-preview {
            display: flex;
            gap: 4px;
            width: 50px;
            height: 36px;
            background: #cbdbe2;
            padding: 3px;
            border-radius: 4px;
        }
        .grid-icon-preview .block {
            background: #94a3b8;
            border-radius: 2px;
            flex: 1;
        }

        .collage-workspace {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }
        @media (max-width: 850px) { .collage-workspace { grid-template-columns: 1fr; } }

        /* Control Panel Zoom & Geser */
        .control-panel {
            background: #f8fafc;
            padding: 16px;
            border-radius: 1rem;
            border: 1px solid #e2ecf5;
        }
        .control-panel h4 {
            font-size: 0.9rem;
            color: #1f3b4c;
            margin-bottom: 8px;
            margin-top: 14px;
            border-bottom: 1px solid #e2ecf5;
            padding-bottom: 4px;
        }
        .control-panel h4:first-of-type { margin-top: 0; }
        
        .slot-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .slot-btn {
            flex: 1;
            padding: 8px;
            background: white;
            border: 2px solid #cbdbe2;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .slot-btn.active {
            background: #2c5f8a;
            color: white;
            border-color: #2c5f8a;
        }

        /* Pad Tombol Panah (D-Pad) */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 38px);
            grid-template-rows: repeat(3, 38px);
            gap: 6px;
            justify-content: center;
            margin: 12px 0;
        }
        .dpad-btn {
            background: white;
            border: 1px solid #cbdbe2;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #2c5f8a;
            transition: 0.1s;
        }
        .dpad-btn:active { background: #e2ecf5; transform: scale(0.95); }

        .badge {
            background: #e2ecf5;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .badge-active { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-images"></i> Studio Kolase Pro Kreatif</h1>
    </div>

    <div class="toolbar">
        <div class="camera-control-box">
            <span><i class="fas fa-camera"></i> Kamera</span>
            <label class="toggle-switch">
                <input type="checkbox" id="cameraToggle">
                <span class="slider-toggle"></span>
            </label>
        </div>
        <button id="uploadBtn" class="btn"><i class="fas fa-upload"></i> Ambil File</button>
        <button id="magicBgBtn" class="btn btn-primary"><i class="fas fa-magic"></i> ✨ Hapus Latar Belakang</button>
        <button id="resetSourceBtn" class="btn"><i class="fas fa-sync"></i> Reset</button>
    </div>

    <div style="text-align: center;">
        <video id="videoElement" autoplay playsinline></video>
        <button id="captureBtn" class="btn btn-primary" style="display:none; margin: 0 auto 16px;"><i class="fas fa-dot-circle"></i> Ambil Gambar</button>
    </div>

    <div class="editor-grid">
        <div class="canvas-card">
            <div class="canvas-title">
                <span>Foto Sumber Aktif</span>
                <span id="sourceStatus" class="badge">Kosong</span>
            </div>
            <div class="canvas-wrapper">
                <canvas id="sourceCanvas" width="500" height="380"></canvas>
            </div>
            <div style="margin-top:12px; display:flex; align-items:center; gap:10px;">
                <span style="font-size:12px; white-space:nowrap;">Sensitivitas Warna:</span>
                <input type="range" id="toleranceSlider" min="5" max="120" value="35" style="flex:1;">
                <span id="toleranceValue" style="font-size:12px; font-weight:600;">35</span>
            </div>
        </div>
        <div class="canvas-card">
            <div class="canvas-title">
                <span>Hasil Transparansi Magic</span>
            </div>
            <div class="canvas-wrapper">
                <canvas id="resultCanvas" width="500" height="380" style="background: repeating-conic-gradient(#e2ecf5 0% 25%, #ffffff 0% 50%) 50% / 16px 16px;"></canvas>
            </div>
            <div style="margin-top: 12px; text-align: center;">
                <button id="sendToSlotBtn" class="btn btn-primary" style="padding:8px 16px;"><i class="fas fa-arrow-alt-circle-down"></i> Kirim ke Slot Kolase Terpilih</button>
            </div>
        </div>
    </div>

    <div class="collage-section">
        <h3><i class="fas fa-th-large"></i> Desain Ragam Model Grid 2 Kotak</h3>
        
        <div class="grid-library">
            <div class="grid-option active" data-model="vertical-split">
                <div class="grid-icon-preview">
                    <div class="block"></div>
                    <div class="block"></div>
                </div>
                <span style="font-size:12px; font-weight:600;">Kiri - Kanan</span>
            </div>
            <div class="grid-option" data-model="horizontal-split">
                <div class="grid-icon-preview" style="flex-direction: column;">
                    <div class="block"></div>
                    <div class="block"></div>
                </div>
                <span style="font-size:12px; font-weight:600;">Atas - Bawah</span>
            </div>
            <div class="grid-option" data-model="asymmetric-split">
                <div class="grid-icon-preview">
                    <div class="block" style="flex: 2;"></div>
                    <div class="block" style="flex: 1;"></div>
                </div>
                <span style="font-size:12px; font-weight:600;">Asimetris Model</span>
            </div>
        </div>

        <div class="collage-workspace">
            <div style="background:#f8fafc; padding:10px; border-radius:1rem; display:flex; align-items:center; justify-content:center; border:1px solid #e2ecf5;">
                <canvas id="collageCanvas" width="650" height="420" style="width:100%; box-shadow:0 6px 20px rgba(0,0,0,0.06); background: #fff;"></canvas>
            </div>

            <div class="control-panel">
                <h4>1. Pilih Slot Kotak</h4>
                <div class="slot-selector">
                    <div class="slot-btn active" data-slot="0">Kotak 1</div>
                    <div class="slot-btn" data-slot="1">Kotak 2</div>
                </div>

                <h4>2. Atur Perbesar (Zoom)</h4>
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                    <input type="range" id="zoomSlider" min="20" max="300" value="100" style="flex:1;">
                    <span id="zoomValue" style="font-size:12px; font-weight:600; min-width:35px;">100%</span>
                </div>

                <h4>3. Geser Posisi Foto</h4>
                <div class="dpad">
                    <div></div>
                    <button class="dpad-btn" data-move="up"><i class="fas fa-arrow-up"></i></button>
                    <div></div>
                    <button class="dpad-btn" data-move="left"><i class="fas fa-arrow-left"></i></button>
                    <button class="dpad-btn" id="resetPosBtn" title="Reset Posisi"><i class="fas fa-compress-arrows-alt"></i></button>
                    <button class="dpad-btn" data-move="right"><i class="fas fa-arrow-right"></i></button>
                    <div></div>
                    <button class="dpad-btn" data-move="down"><i class="fas fa-arrow-down"></i></button>
                    <div></div>
                </div>

                <button id="downloadCollage" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:15px; background:#1b5e20;"><i class="fas fa-save"></i> Simpan File Kolase</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // Referensi Elemen Dom
        const sourceCanvas = document.getElementById('sourceCanvas');
        const resultCanvas = document.getElementById('resultCanvas');
        const collageCanvas = document.getElementById('collageCanvas');
        const ctxSrc = sourceCanvas.getContext('2d');
        const ctxRes = resultCanvas.getContext('2d');
        const ctxCol = collageCanvas.getContext('2d');

        const videoElement = document.getElementById('videoElement');
        const cameraToggle = document.getElementById('cameraToggle');
        const captureBtn = document.getElementById('captureBtn');

        let originalImg = null;
        let isImgLoaded = false;
        let currentModel = 'vertical-split';
        let currentActiveSlot = 0;
        let streamTrack = null;

        // Data Management Struktur Array untuk 2 Kotak Kolase
        let collageSlots = [
            { img: null, zoom: 1, x: 0, y: 0 },
            { img: null, zoom: 1, x: 0, y: 0 }
        ];

        // Tampilan dasar awal canvas
        ctxSrc.fillStyle = "#f1f5f9"; ctxSrc.fillRect(0, 0, 500, 380);

        // --- SISTEM KAMERA BELAKANG ON / OFF ---
        cameraToggle.addEventListener('change', async () => {
            if (cameraToggle.checked) {
                try {
                    videoElement.style.display = 'block';
                    captureBtn.style.display = 'inline-flex';
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: "environment" } } // Mengutamakan kamera belakang ponsel
                    });
                    videoElement.srcObject = stream;
                    streamTrack = stream;
                } catch (err) {
                    alert("Akses kamera ditolak atau tidak ditemukan.");
                    cameraToggle.checked = false;
                    videoElement.style.display = 'none';
                    captureBtn.style.display = 'none';
                }
            } else {
                turnOffCamera();
            }
        });

        function turnOffCamera() {
            if (streamTrack) {
                streamTrack.getTracks().forEach(track => track.stop());
                streamTrack = null;
            }
            videoElement.style.display = 'none';
            captureBtn.style.display = 'none';
            videoElement.srcObject = null;
        }

        // Ambil gambar dari kamera
        captureBtn.addEventListener('click', () => {
            const capCanvas = document.createElement('canvas');
            capCanvas.width = videoElement.videoWidth || 640;
            capCanvas.height = videoElement.videoHeight || 480;
            const capCtx = capCanvas.getContext('2d');
            
            // Menggambar gambar mirror yang sesuai asli
            capCtx.translate(capCanvas.width, 0);
            capCtx.scale(-1, 1);
            capCtx.drawImage(videoElement, 0, 0);

            const img = new Image();
            img.onload = () => {
                processLoadImage(img);
                turnOffCamera();
                cameraToggle.checked = false;
            };
            img.src = capCanvas.toDataURL('image/png');
        });

        // --- MANAJEMEN AMBIL FILE & UPLOAD ---
        document.getElementById('uploadBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => processLoadImage(img);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        });

        function processLoadImage(img) {
            originalImg = img;
            ctxSrc.fillStyle = "#ffffff"; ctxSrc.fillRect(0,0, 500, 380);
            
            // Mengatur rasio agar pas di dalam canvas tengah
            const ratio = Math.min(500 / img.width, 380 / img.height);
            const w = img.width * ratio; const h = img.height * ratio;
            const x = (500 - w) / 2; const y = (380 - h) / 2;

            ctxSrc.drawImage(img, x, y, w, h);
            ctxRes.clearRect(0, 0, 500, 380);
            ctxRes.drawImage(sourceCanvas, 0, 0);
            
            isImgLoaded = true;
            document.getElementById('sourceStatus').innerText = "Foto Aktif";
            document.getElementById('sourceStatus').classList.add('badge-active');
        }

        // --- PERBAIKAN FITUR HAPUS LATAR BELAKANG INTERAKTIF ---
        const toleranceSlider = document.getElementById('toleranceSlider');
        const toleranceValue = document.getElementById('toleranceValue');
        toleranceSlider.addEventListener('input', (e) => { toleranceValue.innerText = e.target.value; });

        document.getElementById('magicBgBtn').addEventListener('click', () => {
            if (!isImgLoaded) return alert("Silakan unggah atau jepret foto terlebih dahulu.");
            
            const srcData = ctxSrc.getImageData(0, 0, 500, 380);
            const pixels = srcData.data;
            const outData = ctxRes.createImageData(500, 380);
            const outPixels = outData.data;

            // Mengambil sampel warna rata-rata dari sudut tepi atas kiri dan kanan agar ekstra akurat
            const targetR = (pixels[0] + pixels[(500 - 1) * 4]) / 2;
            const targetG = (pixels[1] + pixels[(500 - 1) * 4 + 1]) / 2;
            const targetB = (pixels[2] + pixels[(500 - 1) * 4 + 2]) / 2;
            
            const limit = parseInt(toleranceSlider.value);

            for (let i = 0; i < pixels.length; i += 4) {
                const r = pixels[i];   const g = pixels[i+1]; const b = pixels[i+2];
                
                // Menghitung Euclidean Distance warna agar pemotongan sangat bersih
                const distance = Math.sqrt(
                    Math.pow(r - targetR, 2) + 
                    Math.pow(g - targetG, 2) + 
                    Math.pow(b - targetB, 2)
                );

                outPixels[i] = r; outPixels[i+1] = g; outPixels[i+2] = b;
                outPixels[i+3] = (distance < limit) ? 0 : 255; // Menjadikan transparan jika sesuai toleransi
            }

            ctxRes.putImageData(outData, 0, 0);
            canvasConfetti({ particleCount: 40, spread: 40 });
        });

        document.getElementById('resetSourceBtn').addEventListener('click', () => {
            if (originalImg) processLoadImage(originalImg);
        });

        // --- CORE ENGINE KOLASE INTERAKTIF (ZOOM, GESER, MULTI-GRID) ---
        
        // Memilih Slot Kotak Aktif
        document.querySelectorAll('.slot-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentActiveSlot = parseInt(btn.getAttribute('data-slot'));
                loadSlotTransformToSliders();
                renderCollageGrid();
            });
        });

        function loadSlotTransformToSliders() {
            const currentSlot = collageSlots[currentActiveSlot];
            document.getElementById('zoomSlider').value = currentSlot.zoom * 100;
            document.getElementById('zoomValue').innerText = `${Math.round(currentSlot.zoom * 100)}%`;
        }

        // Kirim hasil pemotongan gambar ke slot kolase
        document.getElementById('sendToSlotBtn').addEventListener('click', () => {
            if (!isImgLoaded) return alert("Belum ada gambar.");
            const dataUrl = resultCanvas.toDataURL('image/png');
            const targetImg = new Image();
            targetImg.onload = () => {
                collageSlots[currentActiveSlot].img = targetImg;
                collageSlots[currentActiveSlot].zoom = 1;
                collageSlots[currentActiveSlot].x = 0;
                collageSlots[currentActiveSlot].y = 0;
                loadSlotTransformToSliders();
                renderCollageGrid();
                canvasConfetti({ particleCount: 30, spread: 20 });
            };
            targetImg.src = dataUrl;
        });

        // Input Perubahan Zoom Slider
        document.getElementById('zoomSlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('zoomValue').innerText = `${val}%`;
            collageSlots[currentActiveSlot].zoom = val / 100;
            renderCollageGrid();
        });

        // Input Pergeseran Menggunakan Pad Tombol Arah (D-Pad)
        document.querySelectorAll('.dpad-btn[data-move]').forEach(btn => {
            btn.addEventListener('click', () => {
                const direction = btn.getAttribute('data-move');
                const speedStep = 15 / collageSlots[currentActiveSlot].zoom; // Menyesuaikan pergeseran dengan besaran skala zoom

                if (direction === 'up') collageSlots[currentActiveSlot].y -= speedStep;
                if (direction === 'down') collageSlots[currentActiveSlot].y += speedStep;
                if (direction === 'left') collageSlots[currentActiveSlot].x -= speedStep;
                if (direction === 'right') collageSlots[currentActiveSlot].x += speedStep;

                renderCollageGrid();
            });
        });

        document.getElementById('resetPosBtn').addEventListener('click', () => {
            collageSlots[currentActiveSlot].zoom = 1;
            collageSlots[currentActiveSlot].x = 0;
            collageSlots[currentActiveSlot].y = 0;
            loadSlotTransformToSliders();
            renderCollageGrid();
        });

        // Memilih Variasi Model Grid 2 Kotak
        document.querySelectorAll('.grid-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.grid-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                currentModel = opt.getAttribute('data-model');
                renderCollageGrid();
            });
        });

        // --- ALGORITMA DRAWING GENERATOR GRID KOTAK ---
        function renderCollageGrid() {
            const W = collageCanvas.width;
            const H = collageCanvas.height;
            ctxCol.clearRect(0, 0, W, H);

            // Background Frame Kolase Bersih Modern
            ctxCol.fillStyle = "#ffffff"; ctxCol.fillRect(0, 0, W, H);

            let areas = [];
            const borderGap = 10; // Ketebalan pembatas antar kotak

            // Logika Pembagian Koordinat Layout Berbagai Ragam Grid 2 Kotak
            if (currentModel === 'vertical-split') {
                let wBox = (W - borderGap * 3) / 2;
                let hBox = H - borderGap * 2;
                areas.push({ x: borderGap, y: borderGap, w: wBox, h: hBox });
                areas.push({ x: borderGap * 2 + wBox, y: borderGap, w: wBox, h: hBox });
            } 
            else if (currentModel === 'horizontal-split') {
                let wBox = W - borderGap * 2;
                let hBox = (H - borderGap * 3) / 2;
                areas.push({ x: borderGap, y: borderGap, w: wBox, h: hBox });
                areas.push({ x: borderGap, y: borderGap * 2 + hBox, w: wBox, h: hBox });
            } 
            else if (currentModel === 'asymmetric-split') {
                let wBoxLeft = (W - borderGap * 3) * 0.65; // Kotak 1 jauh lebih besar
                let wBoxRight = (W - borderGap * 3) * 0.35;
                let hBox = H - borderGap * 2;
                areas.push({ x: borderGap, y: borderGap, w: wBoxLeft, h: hBox });
                areas.push({ x: borderGap * 2 + wBoxLeft, y: borderGap, w: wBoxRight, h: hBox });
            }

            // Mulai Proses Menggambar Elemen Gambar ke Masing-Masing Area
            areas.forEach((area, idx) => {
                const slotData = collageSlots[idx];

                ctxCol.save();
                
                // Kliping Kotak Ber sudut Melengkung Halus (Rounded Border Layout)
                ctxCol.beginPath();
                ctxCol.roundRect(area.x, area.y, area.w, area.h, 12);
                ctxCol.clip();

                // Background internal penanda area kotak
                ctxCol.fillStyle = (idx === currentActiveSlot) ? "#f1f7fe" : "#f8fafc";
                ctxCol.fillRect(area.x, area.y, area.w, area.h);

                if (slotData.img) {
                    ctxCol.save();
                    // Jadikan tengah kotak sebagai poros rotasi, pergeseran, dan pembesaran gambar
                    ctxCol.translate(area.x + area.w / 2, area.y + area.h / 2);
                    ctxCol.scale(slotData.zoom, slotData.zoom);
                    ctxCol.translate(slotData.x, slotData.y);

                    // Kalkulasi otomatis aspek rasio gambar (Image Cover Ratio)
                    const imgRatio = slotData.img.width / slotData.img.height;
                    const areaRatio = area.w / area.h;
                    let dW, dH;

                    if (imgRatio > areaRatio) {
                        dH = area.h; dW = area.h * imgRatio;
                    } else {
                        dW = area.w; dH = area.w / imgRatio;
                    }

                    ctxCol.drawImage(slotData.img, -dW / 2, -dH / 2, dW, dH);
                    ctxCol.restore();
                } else {
                    // Teks indikator bantuan jika kosong
                    ctxCol.fillStyle = "#94a3b8";
                    ctxCol.font = "bold 13px 'Inter'";
                    ctxCol.textAlign = "center";
                    ctxCol.fillText(`Kotak Slot ${idx + 1} Kosong`, area.x + area.w / 2, area.y + area.h / 2);
                }

                // Gambar stroke penanda apabila kotak sedang aktif dipilih untuk digeser
                if (idx === currentActiveSlot) {
                    ctxCol.strokeStyle = "#2c5f8a"; ctxCol.lineWidth = 3;
                    ctxCol.stroke();
                }

                ctxCol.restore();
            });
        }

        // Download Hasil Kolase Akhir
        document.getElementById('downloadCollage').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'hasil_studio_kolase.png';
            link.href = collageCanvas.toDataURL('image/png');
            link.click();
        });

        // Gambar pertama kali dibuka
        renderCollageGrid();
    })();
</script>
</body>
</html>
